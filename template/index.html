<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{#title}}
    <title>{{.}}</title>
    {{/title}}
    <script
      src="./{{REL_PATH}}shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./{{REL_PATH}}shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "{{APP_ENGINE}}",
        relPath: "{{REL_PATH}}",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  </head>
  <body>
    {{{ include_before_body }}}
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
    <div
      id="live-message"
      style="position:fixed;bottom:16px;right:16px;padding:10px 14px;background:#222;color:#fff;border-radius:8px;font-family:sans-serif;z-index:9999"
    >
      Loading packages ...
    </div>
    
    <script>
      const liveMessage = document.getElementById("live-message");
    
      let seconds = 0;
      let countdown = 35;
      let calculatorReady = false;
    
      function updateLoadingMessage() {
        // if (calculatorReady) {
        //   liveMessage.textContent = "Calculator is ready.";
        //   return;
        // }
    
        if (seconds < 5) {
          liveMessage.textContent = "Loading packages ...";
          return;
        }
    
        if (countdown <= 5) {
          liveMessage.textContent =
            "This is taking longer than expected. Thanks for your patience.";
          return;
        }
    
        liveMessage.textContent = `Loading packages ... ${countdown}`;
        countdown -= 1;
      }
    
      const loadingTimer = setInterval(() => {
        seconds += 1;
        updateLoadingMessage();
      }, 1000);
    
      updateLoadingMessage();

      window.addEventListener("message", (event) => {
        if (
          event.origin === window.location.origin &&
          event.data?.type === "calculator-ready"
        ) {
          window.dispatchEvent(new CustomEvent("calculator-ready"));
        }
      });
    
      window.addEventListener("calculator-ready", () => {
        clearInterval(loadingTimer);
        liveMessage.remove();
      });
    </script>
    {{{ include_after_body }}}
  </body>
</html>
